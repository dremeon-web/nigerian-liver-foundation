media:
  input: media
  output: /media
content:
  - name: updates
    label: Updates
    type: file
    path: updates.json
    format: json
    list: true
    fields:
      - name: date
        label: Date
        type: date
      - name: title
        label: Title
        type: string
      - name: text
        label: Short summary
        type: text
  - name: resources
    label: Resources (downloads)
    type: file
    path: resources.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
      - name: note
        label: Short description
        type: text
      - name: file
        label: File to download
        type: file
